# Đặt file này tại: .github/workflows/snake.yml (trong repo JWHYHSTS/JWHYHSTS)
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # chạy mỗi ngày lúc 07:00 giờ Việt Nam
  workflow_dispatch:       # cho phép bấm chạy tay
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5c7cfa&color_dots=#161b22,#1e3a8a,#2f4fbf,#3b5bdb,#5c7cfa

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
