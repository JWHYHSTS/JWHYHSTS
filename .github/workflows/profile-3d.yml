# Đặt file này tại: .github/workflows/profile-3d.yml (trong repo JWHYHSTS/JWHYHSTS)
name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # chạy mỗi ngày lúc 01:00 giờ Việt Nam
  workflow_dispatch:       # cho phép bấm chạy tay

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: update 3D contribution graph" || exit 0
          git push
